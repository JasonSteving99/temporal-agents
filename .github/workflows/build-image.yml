name: build-image

# Build the coding-agent runtime image, push it to GHCR, then build the E2B template the agent's
# tools run in — so both are ready before the deployed worker polls. The template is built FROM the
# just-pushed image (same commit, same examples/ bytes), so its content hash matches exactly what the
# deployed worker computes and looks up at runtime (SandboxConfig.require_prebuilt=True — the worker
# never builds the template itself).
#
# Required repo secret: E2B_API_KEY (Settings -> Secrets and variables -> Actions).
# One-time: after the first run, set the GHCR package visibility to Public so `docker compose pull`
# on the host needs no login.

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image name (GHCR requires lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build (or verify) the E2B template the tools run in, using the image we just pushed (pinned by
  # immutable digest). This uploads examples/ to E2B and triggers the remote build; it needs only
  # E2B_API_KEY. Fails the pipeline if the template isn't ready, so a deploy can't race an unbuilt
  # image (which would surface as SandboxImageNotBuilt on the first tool call).
  build-template:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Require E2B_API_KEY
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          if [ -z "$E2B_API_KEY" ]; then
            echo "::error::E2B_API_KEY secret is not set — add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the E2B template
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          # SANDBOX.backend names a provider (it mints a per-sandbox Tailscale key), which cannot run
          # offline — no worker here — so the build takes the concrete config explicitly. It's the
          # same object the provider copies at runtime, so build-time and run-time can't disagree.
          docker run --rm -e E2B_API_KEY "$IMAGE" python -c "
          from temporal_agent_harness.harness.sandbox import build_sandbox
          from examples.sandbox_tools.coding_agent.tools import SANDBOX, SANDBOX_BACKEND
          r = build_sandbox(SANDBOX, backend=SANDBOX_BACKEND)
          print('template:', r.status, '-', r.detail)
          assert r.status in ('built', 'ready'), f'template build failed: {r.status} {r.detail}'
          "
