# Runnable environment for self-hosting the sandboxed coding agent (examples/sandbox_tools/coding_agent).
#
# This fork keeps ONLY that example — the harness itself is pulled as a git dependency on the OFFICIAL
# repo's `sandbox-tools` branch (the vendored `temporal_agent_harness/` source was deleted; it was
# byte-identical to that branch). This is not an installable package: it's just a dependency spec that
# `uv sync` resolves into a venv, from which the four processes run as `python -m examples.*`.
[project]
name = "temporal-coding-agent-deploy"
version = "0.1.0"
requires-python = ">=3.12"  # the harness `sandbox` extra (remote-box) requires Python >= 3.12
dependencies = [
    # The harness + the three extras this example needs. Tracked as a BRANCH here because uv.lock
    # pins the exact commit for this image (`uv lock --upgrade-package temporal-agent-harness` moves
    # it). The sandbox image has no lock and pins the SHA inline instead, so after every bump copy
    # the lock's resolved SHA into examples/sandbox_tools/coding_agent/pyproject.toml or the two
    # images drift apart — see "Updating the harness" in examples/Dockerfile.sandbox-coding-agent.
    #   sandbox -> remote-box (+ the E2B/Daytona SDKs)  the tools run in an E2B cloud sandbox
    #   ui      -> fastapi[standard] (+ uvicorn)     the packaged web app + browser UI (dist ships in the wheel)
    #   genai   -> google-genai (+ google-auth)      the agent drives the Gemini Interactions API
    "temporal-agent-harness[sandbox,ui,genai] @ git+https://github.com/temporal-community/temporal-agent-harness.git@sandbox-tools",
    # remote-box, pinned AHEAD of the harness's own constraint (which would resolve 0.7.0 from
    # PyPI). 0.9.0 adds what the E2B backend needs to carry a per-sandbox credential:
    # `E2B.env_vars` (0.7.0 had none — only Daytona did) and `post_create_cmd`, a root, backgrounded
    # command fired once after creation that inherits those env vars. That hook is the ONLY place the
    # Tailscale key can be consumed on E2B: `start_cmd` (and any Dockerfile CMD/ENTRYPOINT, which is
    # translated into one) runs while the TEMPLATE builds and is snapshotted into every sandbox, so it
    # starts before the sandbox — and its env — exists.
    # 0.10.0 adds `allow_public_traffic` on top of that, which is what makes previews SAFE: with it
    # False the sandbox's own e2b.app URL returns 403 without a token only the preview proxy holds, so
    # a preview cannot be shared past the proxy's sign-in. It can only be set at creation — E2B's
    # update_network cannot change it — so it has to come through remote-box.
    # Pinned above the harness's own constraint, which would otherwise resolve an older PyPI release.
    "remote-box>=0.10.0",
    # Pin google-genai to the exact version the harness `sandbox-tools` branch was built against.
    # The Gemini plugin imports the private `google.genai._interactions` module, which was removed
    # (renamed to a public `interactions.py`) in later releases — 2.14.0 breaks import. 2.8.0 is what
    # upstream's own lock pinned, so it's the known-good version.
    "google-genai==2.8.0",
    # the preview/ package imports aiohttp directly (the upstream justfile injected it ad-hoc via
    # `uv run --with aiohttp`); declare it so it's baked into the image.
    "aiohttp>=3.9",
    # Headless Chromium driver for the preview gallery's screenshots. The wheel is small; the
    # browser itself is downloaded in the Dockerfile. preview/screenshots.py imports it lazily and
    # degrades to placeholder tiles if it (or the browser) is missing, so this is soft-required.
    "playwright>=1.49",
]

[tool.uv]
# This repo is an environment spec, not a package to build/install — `uv sync --no-install-project`
# installs only the dependencies above; `examples/` is imported as a namespace package off PYTHONPATH.
package = false
